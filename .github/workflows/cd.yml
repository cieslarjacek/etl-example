name: CD

# develop accepts changes only through pull requests with green CI,
# so a push to develop is a successfully merged pull request.
on:
  push:
    branches: [develop]

permissions:
  contents: read

# Deployments run one at a time in merge order and are never cancelled
# halfway.
concurrency:
  group: cd
  cancel-in-progress: false

env:
  IMAGE_NAME: etl-example

jobs:
  build:
    name: build
    runs-on: ubuntu-26.04
    outputs:
      dev-tag: ${{ steps.tags.outputs.dev-tag }}
      prod-tag: ${{ steps.tags.outputs.prod-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive the image tags
        id: tags
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "dev-tag=dev-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "prod-tag=prod-${version}" >> "${GITHUB_OUTPUT}"
      - name: Build the image once; later jobs promote this exact image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.dev-tag }}
        run: |
          make docker-build IMAGE="${IMAGE}"
          docker save "${IMAGE}" | gzip > image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy-dev:
    name: deploy to dev/test
    needs: build
    runs-on: ubuntu-26.04
    environment: dev
    env:
      IMAGE: etl-example:${{ needs.build.outputs.dev-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Load the image
        run: gunzip --stdout image.tar.gz | docker load
      - name: Start the container in dev
        run: make docker-run-dev IMAGE="${IMAGE}"
      - name: Smoke-test dev
        run: make smoke-test EXPECTED_DOCS_STATUS=200
      - name: Deploy to dev/test (placeholder)
        run: echo "Placeholder - push ${IMAGE} to the registry and roll out to dev/test."
      - name: Stop the container
        if: always()
        run: make docker-stop || true # the container may not have started

  deploy-prod:
    name: deploy to prod
    needs: [build, deploy-dev]
    runs-on: ubuntu-26.04
    # The prod environment requires a reviewer's approval before this
    # job starts (repository settings, Environments).
    environment: prod
    env:
      DEV_IMAGE: etl-example:${{ needs.build.outputs.dev-tag }}
      PROD_IMAGE: etl-example:${{ needs.build.outputs.prod-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Load and promote the image tested in dev
        run: |
          gunzip --stdout image.tar.gz | docker load
          docker tag "${DEV_IMAGE}" "${PROD_IMAGE}"
      - name: Start the container in prod
        run: make docker-run-prod IMAGE="${PROD_IMAGE}"
      - name: Smoke-test prod (docs must be hidden)
        run: make smoke-test EXPECTED_DOCS_STATUS=404
      - name: Deploy to prod (placeholder)
        run: echo "Placeholder - push ${PROD_IMAGE} to the registry and roll out to prod."
      - name: Stop the container
        if: always()
        run: make docker-stop || true # the container may not have started

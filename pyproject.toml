[project]
name = "etl-example"
version = "0.1.0"
description = """\
    Tracking-survey ETL example API: validate, clean, transform, load \
    and summarise survey waves."""
readme = "README.md"
authors = [{ name = "Jacek Cieślar" }]
requires-python = ">=3.15"
dependencies = [
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 79
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A", "ANN", "B", "C4", "C90", "D", "E", "ERA", "F", "FBT", "I", "N",
    "PL", "PT", "PTH", "RET", "RUF", "S", "SIM", "UP", "W",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
# Tests: pytest's assert, no docstrings on test functions, literal
# expected values in assertions.
"tests/**" = ["D100", "D103", "PLR2004", "S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--cov=etl_example",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]
testpaths = ["tests"]

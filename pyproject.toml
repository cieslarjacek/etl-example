[project]
name = "etl-example"
version = "0.1.0"
description = """\
    Tracking-survey ETL example API: validate, clean, transform, load \
    and summarise survey waves."""
readme = "README.md"
authors = [{ name = "Jacek Cieślar" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.163.1",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
survey-client = "survey_client.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
notebook = [
    "httpx2>=2.16.2",
    "ipykernel>=7.4.0",
]

[tool.uv]
# make install also installs the notebook kernel.
default-groups = ["dev", "notebook"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution keeps the repository name and ships two modules:
# the service and the client that stands for an outside program.
module-name = ["survey_etl", "survey_client"]

[tool.ruff]
line-length = 79
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A", "ANN", "B", "C4", "C90", "D", "E", "ERA", "F", "FBT", "I", "N",
    "PL", "PT", "PTH", "RET", "RUF", "S", "SIM", "TID251", "UP", "W",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The client stands for an outside program: it may use only the
# service's HTTP API. Only the service and the tests import it.
"survey_etl".msg = "only survey_etl and tests may import survey_etl"

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
# Tests: pytest's assert, no docstrings on test functions, literal
# expected values in assertions.
"tests/**" = ["D100", "D103", "D104", "PLR2004", "S101", "TID251"]
"src/survey_etl/**" = ["TID251"]
# The notebook drives the service in-process and reads like a script.
"notebooks/**" = ["D100", "TID251"]
# The # SQL: comments show the plain SQL of each statement for the
# presentation; ERA001 mistakes SQL such as COALESCE(SUM(x), 0) for
# commented-out Python.
"src/survey_etl/storage/*.py" = ["ERA001"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--cov=survey_etl",
    "--cov=survey_client",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]
testpaths = ["tests"]

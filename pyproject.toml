[project]
name = "etl-example"
version = "0.1.0"
description = """\
    Tracking-survey ETL API: validate, clean, transform, load and \
    summarise survey waves."""
readme = "README.md"
authors = [{ name = "Jacek Cieślar" }]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.163.1",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
etl-example = "etl_example.cli:main"

[dependency-groups]
dev = [
    # httpx2 is the maintained successor of httpx; Starlette's
    # TestClient imports it first and deprecates httpx.
    "httpx2>=2.16.2",
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 79
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A", "ANN", "B", "C4", "C90", "D", "E", "ERA", "F", "FBT", "I", "N",
    "PL", "PT", "PTH", "RET", "RUF", "S", "SIM", "UP", "W",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
# Tests: pytest's assert, no docstrings on test functions, literal
# expected values in assertions.
"tests/**" = ["D100", "D103", "PLR2004", "S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--cov=etl_example",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]
testpaths = ["tests"]

# nbformat ships without type hints; only the notebook runner calls it.
[[tool.mypy.overrides]]
module = "run_notebook"
disallow_untyped_calls = false
